name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: HisabKhata-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK as a release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk HisabKhata.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest HisabKhata.apk --title "হিসাবের খাতা" --notes "ফোনে HisabKhata.apk নামিয়ে ইনস্টল করুন।"
